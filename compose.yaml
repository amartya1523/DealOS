services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dealos
      POSTGRES_PASSWORD: dealos
      POSTGRES_DB: dealos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealos -d dealos"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - dealos_postgres:/var/lib/postgresql/data

volumes:
  dealos_postgres:

